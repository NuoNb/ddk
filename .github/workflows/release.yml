name: Build and Release ddk

on:
  workflow_dispatch:
    inputs:
      kmi_filter:
        description: '只构建该 KMI（如 android16-6.12；留空则全量 matrix）'
        required: false
        default: ''

# 推送镜像到本仓库的 ghcr 包空间
permissions:
  contents: read
  packages: write

env:
  REG: ghcr.io/nuonb

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Generate matrix from mapping.json
        id: gen
        uses: actions/github-script@v7
        env:
          KMI_FILTER: ${{ github.event.inputs.kmi_filter }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('mapping.json', 'utf8');
            const data = JSON.parse(raw);
            const filter = process.env.KMI_FILTER || '';
            const matrix = (data.matrix || [])
              .filter(m => !filter || m.android === filter)
              .map(m => ({
                source_name: m.android,
                clang_name: m.clang,
              }));
            if (matrix.length === 0) core.setFailed(`kmi_filter 无匹配: ${filter}`);
            core.setOutput('matrix', JSON.stringify(matrix));
  
  toolchains:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          submodules: false

    - name: Pull lfs
      run: |
        git lfs install --skip-repo
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1
        # LFS 内容必须进子模块内拉取；主仓库范围的 lfs pull 不会下钻子模块
        # clang + rust：部分 KMI 的 toolchain 镜像需要导入 rust 工具链
        cd prebuilts
        git lfs pull --include="clang/,rust/"
        cd ..
        # 体积自检：tarball 应为 GB 级；若仍是 ~百字节说明是 LFS 指针文件，快速失败
        for f in prebuilts/clang/*.tar.zst prebuilts/rust/*.tar.zst; do
          [ -f "$f" ] || continue
          size=$(stat -c %s "$f")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::$f 只有 ${size} 字节（LFS 指针未拉取成功）"; exit 1
          fi
          echo "$f: $((size/1024/1024)) MB"
        done
        ls -al prebuilts/clang/

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build images
      run: |
        cd docker
        make builder PUSH=1 REG=${REG}
        make toolchains PUSH=1 REG=${REG}
  
  build:
    needs: ["prepare", "toolchains"]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Checkout code
      uses: actions/checkout@v4
      with:
          lfs: false

    - name: Pull lfs
      run: |
        git lfs install --skip-repo
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1
        # LFS 内容必须进子模块内拉取；主仓库范围的 lfs pull 不会下钻子模块
        cd prebuilts
        git lfs pull --include="src/src.${{ matrix.source_name }}.tar.zst"
        git lfs pull --include="kdir/kdir.${{ matrix.source_name }}.tar.zst"
        cd ..
        # 体积自检：tarball 应为百 MB~GB 级；~百字节说明是 LFS 指针文件，快速失败
        for f in prebuilts/src/src.${{ matrix.source_name }}.tar.zst prebuilts/kdir/kdir.${{ matrix.source_name }}.tar.zst; do
          size=$(stat -c %s "$f")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::$f 只有 ${size} 字节（LFS 指针未拉取成功）"; exit 1
          fi
          echo "$f: $((size/1024/1024)) MB"
        done
        ls -al prebuilts/src/
        ls -al prebuilts/kdir/

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image
      run: |
        cd docker
        make build VER=${{ matrix.source_name }} PUSH=1 REG=${REG} TAG_SUFFIX=-$(date -u +%Y%m%d)